@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Patrick+Hand&family=JetBrains+Mono:wght@400;600&display=swap');
.font-caveat { font-family: 'Caveat', cursive; }
.font-hand { font-family: 'Patrick Hand', cursive; }
.font-mono { font-family: 'JetBrains Mono', monospace; }
.paper-bg {
  background-color: #FFFEF9;
  background-image:
    linear-gradient(90deg, transparent 79px, #fca5a5 79px, #fca5a5 81px, transparent 81px),
    linear-gradient(#e0f2fe 1px, transparent 1px);
  background-size: 100% 100%, 100% 28px;
}
.washi {
  position: relative;
}
.washi::before {
  content: '';
  position: absolute;
  top: -10px;
  left: 50%;
  transform: translateX(-50%) rotate(-2deg);
  width: 80px;
  height: 20px;
  background: rgba(251, 191, 36, 0.6);
  border-left: 2px dashed rgba(0,0,0,0.15);
  border-right: 2px dashed rgba(0,0,0,0.15);
}
.doood {
  border: 2.5px solid #1a1a1a;
  border-radius: 12px 14px 16px 12px / 14px 12px 12px 16px;
}
.scribble {
  text-decoration-style: wavy;
  text-decoration-line: underline;
